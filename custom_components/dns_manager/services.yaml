update_all_records:
  description: "Force update all managed DNS records (A and/or AAAA) to their expected IPs."
  fields:
    config_entry_id:
      description: "Target integration instance (required if multiple entries exist)"
      required: false

update_record:
  description: "Force update a single managed DNS record."
  fields:
    record_name:
      description: "FQDN of the record, e.g. home.example.com"
      required: true
      example: "home.example.com"
    ip_override:
      description: "Optional IPv4 override for this call only (does not persist)"
      required: false
      example: "1.2.3.4"
    ipv6_override:
      description: "Optional IPv6 override for this call only (does not persist)"
      required: false
      example: "2001:db8::1"

refresh_status:
  description: "Force a re-fetch of all record statuses without updating."
